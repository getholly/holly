[package]
name = "holly-client"
version = "0.1.0"
edition = "2021"
description = "Holly API client library with automatic JWT auth and token refresh"
license = "MIT"

[lib]
name = "holly_client"
path = "src/lib.rs"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# JWT decoding (for expiry checks)
jsonwebtoken = "9"
# Time
chrono = { version = "0.4", features = ["serde"] }
# SSE streaming
futures-util = "0.3"
bytes = "1"
# URL
url = "2"
# Logging
tracing = "0.1"
# Mutex for token state
parking_lot = "0.12"
# Base64 for JWT parsing
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1.4"
