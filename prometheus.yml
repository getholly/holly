global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Default evaluation interval

scrape_configs:
  - job_name: 'prometheus'
    # Metrics endpoint for Prometheus itself
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    # Metrics endpoint for cAdvisor
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']

  # Example job for scraping Docker daemon directly (optional, cAdvisor is primary for container metrics)
  # - job_name: 'dockerdaemon'
  #   scrape_interval: 10s
  #   static_configs:
  #     # Assuming Docker daemon metrics are exposed on host.docker.internal:9323
  #     # This requires configuring metrics-addr in /etc/docker/daemon.json on the Docker host
  #     - targets: ['host.docker.internal:9323']

  # Future step: Add a scrape job for webdev's custom health/status endpoint if we go that route.
  # For now, we'll rely on cAdvisor picking up Docker's healthcheck status.
