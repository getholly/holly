{% load static %}

<!-- User Avatar Dropdown -->
<div class="relative my-auto" x-data="{ open: false }">
    <button @click="open = !open" type="button" class="flex items-center focus:outline-none" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
        <span class="sr-only">Open user menu</span>
        {% if request.user.socialaccount_set.all.0.get_avatar_url %}
            <img src="{{ request.user.socialaccount_set.all.0.get_avatar_url }}" alt="User Avatar" class="h-8 w-8 rounded-full object-cover border-2 border-gray-200 dark:border-gray-700">
        {% else %}
            <div class="h-8 w-8 rounded-full bg-indigo-500 flex items-center justify-center text-white">
                {{ request.user.email|slice:":1"|upper }}
            </div>
        {% endif %}
        <svg class="ml-1 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
    </button>

    <!-- Dropdown menu -->
    <div
        x-show="open"
        @click.away="open = false"
        x-transition:enter="transition ease-out duration-100"
        x-transition:enter-start="transform opacity-0 scale-95"
        x-transition:enter-end="transform opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-75"
        x-transition:leave-start="transform opacity-100 scale-100"
        x-transition:leave-end="transform opacity-0 scale-95"
        class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white dark:bg-gray-700 ring-1 ring-black ring-opacity-5 py-1 z-50"
        role="menu"
        aria-orientation="vertical"
        aria-labelledby="user-menu-button"
        tabindex="-1"
    >
        <!-- User info section -->
        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-600">
            <p class="text-sm text-gray-700 dark:text-gray-300 font-medium truncate">{{ request.user.email }}</p>
            {% if request.user.socialaccount_set.all.0.extra_data.login %}
                <p class="text-xs text-gray-500 dark:text-gray-400">
                    @{{ request.user.socialaccount_set.all.0.extra_data.login }}
                </p>
            {% endif %}
        </div>

        <!-- Menu items -->
        <a href="{% url 'user_settings' %}" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem">
            Settings
        </a>
        <a href="{% url 'list_github_app_repositories' %}" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem">
            My Repositories
        </a>
        <a href="{% url 'list_github_app_installations' %}" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem">
            GitHub Installations
        </a>
        <div class="border-t border-gray-100 dark:border-gray-600 my-1"></div>
        <a href="{% url 'account_logout' %}" class="block px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem">
            Sign out
        </a>
    </div>
</div>
