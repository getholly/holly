<!-- templates/partials/chat_filter_modal.html -->
<div id="new-chat-modal"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
     x-data="{ showNewChatModal: false }"
     x-show="showNewChatModal"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 transform scale-95"
     x-transition:enter-end="opacity-100 transform scale-100"
     x-transition:leave="transition ease-in duration-100"
     x-transition:leave-start="opacity-100 transform scale-100"
     x-transition:leave-end="opacity-0 transform scale-95"
     style="display: none;">

  <!-- Click outside to close modal -->
  <div class="absolute inset-0 bg-gray-900 opacity-75" @click="showNewChatModal = false"></div>

  <!-- Modal Panel -->
  <div class="relative bg-gray-800 text-white rounded-lg shadow-lg max-w-lg w-full p-6">
    <h2 class="text-lg font-semibold">Start a New Chat</h2>
    <p class="text-sm text-gray-400">Enter the repo URL to begin analyzing.</p>

    <!-- Form (HTMX or Alpine.js form here) -->
    <form class="mt-4">
      <input type="text" placeholder="Enter GitHub Repo URL"
             class="w-full px-3 py-2 border border-gray-600 rounded-lg bg-gray-700 text-white">

      <div class="mt-4 flex justify-end">
        <button type="button" class="px-4 py-2 text-gray-300" @click="showNewChatModal = false">Cancel</button>
        <button type="submit" class="ml-2 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg">
          Start Chat
        </button>
      </div>
    </form>
  </div>
</div>
