<div class="flex-1 md:p-2 space-y-4 dark:bg-gray-700 overflow-y-auto" id="diagram-tab-content">
  <div class="md:p-2 rounded text-gray-800">
    <div class="flex gap-2 align-bottom md:mb-2">
      <div>
        <h2 class="text-xl font-semibold dark:text-white">Repository Diagram</h2>
      </div>
      <div class="dark:text-white">
        (use mouse or cursor keys to pan around)
      </div>
    </div>

    <div id="diagram-container" class="h-[55vh] bg-transparent dark:bg-gray-700 p-4 rounded dark:text-gray-800">
      <div class="animate-pulse dark:text-white" id="diagram-loading">
        <div class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 dark:text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading diagram...
        </div>
      </div>
      <div class="hidden mermaid h-[70vh]" id="diagram-content"></div>
      <div id="diagram-error-container" class="hidden mt-4">
        <button id="regenerate-diagram-btn"
                class="bg-gray-600 hover:bg-gray-500 text-white font-medium py-2 px-4 rounded shadow-md flex items-center"
                hx-get="{{ diagram_url|default:'/_diagram/' }}{{ username }}/{{ repo }}/"
                hx-headers='{"X-Requested-With": "XMLHttpRequest", "X-Force-Regenerate": "true"}'
                hx-swap="none">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Regenerate Diagram
        </button>
      </div>
    </div>

    <div class="mt-4 dark:bg-gray-700 p-4 rounded">
      <h3 class="text-lg font-medium mb-2 dark:text-white">Explanation</h3>
      <div id="explanation-content" class="text-gray-200">
        <!-- Explanation will be loaded here -->
      </div>
    </div>
  </div>
</div>
