<!-- File Extension Filter Modal -->
<div id="file-extension-filter-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
  <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-11/12 max-w-md">
    <!-- Modal header -->
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-semibold dark:text-white">Filter by File Extension</h3>
      <button id="close-filter-modal" type="button" class="text-gray-400 hover:text-white">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>

    <!-- Total token count for selected extensions -->
    <div class="mb-4 p-2 bg-gray-300 text-gray-800 dark:text-gray-400 dark:bg-gray-700 rounded">
      <p class="text-gray-500 dark:text-white font-medium">Total tokens for selected extensions: <span id="selected-extensions-token-count">0</span></p>
    </div>

    <!-- File extension list -->
    <div class="max-h-60 overflow-y-auto mb-4 border border-gray-700 rounded text-gray-600 dark:text-white">
      <ul id="extension-list" class="divide-y divide-gray-700">
        <!-- Extension items will be added here by JavaScript -->
      </ul>
    </div>

    <!-- Action buttons -->
    <div class="flex justify-end space-x-2">
      <button id="select-all-extensions" type="button" class="text-white bg-gray-600 hover:bg-gray-500
      focus:ring-4 focus:ring-gray-800 font-medium rounded-lg text-sm px-5 py-2.5">
        Select All
      </button>
      <button id="clear-all-extensions" type="button" class="text-white bg-gray-600 hover:bg-gray-700 focus:ring-4 focus:ring-gray-800 font-medium rounded-lg text-sm px-5 py-2.5">
        Clear All
      </button>
      <button id="apply-filter" type="button" class="text-white bg-theme-primary hover:bg-theme-primary
      focus:ring-4 focus:ring-theme-primary font-medium rounded-lg text-sm px-5 py-2.5">
        Apply
      </button>
    </div>
  </div>
</div>
