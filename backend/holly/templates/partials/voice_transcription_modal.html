<!-- templates/partials/voice_transcription_modal.html -->
<div
  x-data="voiceTranscription"
  x-show="showModal"
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  id="voice-transcription-modal"
>
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <!-- Background overlay -->
    <div
      class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75"
      @click="closeModal"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
    ></div>

    <!-- Modal panel -->
    <div
      class="inline-block w-full max-w-md px-4 pt-5 pb-4 overflow-hidden text-left align-bottom transition-all transform bg-white dark:bg-grey-700 rounded-lg shadow-xl dark:bg-gray-800 sm:my-8 sm:align-middle sm:p-6"
      x-transition:enter="ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
    >
      <div>
        <div class="mt-3 text-center sm:mt-5">
          <h3 class="text-lg font-medium leading-6 text-gray-900 dark:text-gray-100">
            Voice Transcription
          </h3>

          <div class="mt-4">
            <textarea id="transcription-area"
                      x-model="transcription"
                      class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                      rows="4"
                      placeholder="Tell me what you want to know about this code base..."
                      :class="{ 'animate-pulse': isRecording }"
            ></textarea>
          </div>
        </div>
      </div>

      <div class="flex justify-between mt-5 sm:mt-6">
        <button
          type="button"
          class="inline-flex justify-center w-full px-4 py-2 text-base font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:text-sm"
          :class="{ 'bg-red-600 hover:bg-red-700': isRecording, 'bg-indigo-600 hover:bg-indigo-700': !isRecording }"
          @click="toggleRecording"
        >
            <span x-show="!isRecording">
          <div class="flex flex-col">
            <div>
              <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                   width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 9v3a5.006 5.006 0 0 1-5 5h-4a5.006 5.006 0 0 1-5-5V9m7 9v3m-3 0h6M11 3h2a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/>
              </svg>

            </div>
            </div>
            </span>
          <span x-show="isRecording">
            <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" fill="none" viewBox="0 0 24 24">
              <rect width="12" height="12" x="6" y="6" stroke="currentColor" stroke-linejoin="round" stroke-width="2"
                    rx="1"/>
            </svg>

            Stop Recording
          </span>
        </button>

        <div class="flex ml-3 space-x-3">
          <button
            type="button"
            class="inline-flex justify-center px-4 py-2 text-base font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:text-sm dark:bg-gray-700 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-600"
            @click="closeModal"
          >
            Cancel
          </button>

          <button
            type="button"
            class="inline-flex justify-center px-4 py-2 text-base font-medium text-white bg-green-600 border border-transparent rounded-md shadow-sm hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 sm:text-sm"
            @click="insertTranscription"
            :disabled="!transcription"
            :class="{ 'opacity-50 cursor-not-allowed': !transcription }"
          >
            Insert
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // Initialize the Alpine.js component immediately
  document.addEventListener('alpine:init', () => {
    // This is already handled in the external file, but adding it here for redundancy
    // in case the external file doesn't load properly
    if (!Alpine.data('voiceTranscription')) {
      Alpine.data('voiceTranscription', () => ({
        isRecording: false,
        transcription: '',
        recognition: null,
        showModal: false,

        init() {
          if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            console.error('Speech recognition not supported');
            return;
          }

          this.recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
          this.recognition.continuous = true;
          this.recognition.interimResults = true;
          this.recognition.lang = 'en-US';

          this.recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
              if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
              } else {
                interimTranscript += event.results[i][0].transcript;
              }
            }

            this.transcription = finalTranscript || interimTranscript;
          };

          this.recognition.onerror = () => this.stopRecording();
          this.recognition.onend = () => {
            if (this.isRecording) this.isRecording = false;
          };
        },

        toggleRecording() {
          if (this.isRecording) {
            this.stopRecording();
          } else {
            this.startRecording();
          }
        },

        startRecording() {
          this.isRecording = true;
          this.recognition.start();
        },

        stopRecording() {
          this.isRecording = false;
          this.recognition.stop();
        },


        insertTranscription() {
          const messageInput = document.querySelector('input[name="message"]');
          if (messageInput && this.transcription) {
            const messageInputComponent = Alpine.$data(messageInput.closest('[x-data]'));
            if (messageInputComponent) {
              messageInputComponent.message = this.transcription;
            }
          }

          this.closeModal();
        },

        closeModal() {
          this.showModal = false;
          this.stopRecording();
          this.transcription = '';
        },

        openModal() {
          this.showModal = true;
          this.transcription = '';
        }
      }));
    }
  });

  // Connect the voice record button
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const voiceRecordButton = document.getElementById('voice-record');

      if (voiceRecordButton) {
        voiceRecordButton.addEventListener('click', () => {
          const modal = document.getElementById('voice-transcription-modal');
          if (modal && Alpine.$data(modal)) {
            Alpine.$data(modal).openModal();
          } else {
            console.error('Modal not found or Alpine data not available');
          }
        });
      }
    }, 200);
  });
</script>
