<div class="flex-1 p-4 space-y-4 bg-[#e4edfa] dark:bg-gray-700 overflow-y-auto" id="source-code-tab-content">
  {% csrf_token %}
  <div class=" p-4 rounded text-gray-800 ">
    <h2 class="text-xl font-semibold mb-4 dark:text-white">Source Code Viewer</h2>

    <div id="source-code-container" class="dark:bg-gray-700 p-4 ">
      <div id="source-code-info" class="mb-4 dark:text-gray-300 text-sm">
        <p>Select files from the tree view on the left to display their contents here. Copy Paste to your llm of choice!</p>
      </div>

      <div id="source-code-actions" class="flex gap-2 mb-4">
        <button id="copy-source-code" class="px-4 py-2 bg-white text-gray-800 dark:text-white dark:bg-gray-600 rounded dark:hover:bg-gray-500 disabled:opacity-50
         disabled:cursor-not-allowed duration-700 " disabled>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          Copy
        </button>
        <button id="download-source-code" class="px-4 py-2 bg-theme-primary-light dark:bg-theme-primary text-white rounded hover:bg-theme-primary
        disabled:opacity-50 disabled:cursor-not-allowed duration-700 dark:hover:bg-[#5a6cdb]" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          Download
        </button>
      </div>

      <div id="source-code-loading" class="hidden animate-pulse text-gray-800 dark:text-white">
        <div class="flex items-center justify-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-800 dark:text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Loading source code...
        </div>
      </div>

      <pre id="source-code-content" class="dark:text-gray-200 overflow-x-auto whitespace-pre-wrap break-normal text-sm"></pre>
    </div>
  </div>
</div>
