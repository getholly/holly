[project]
name = "llmrepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
  "django-allauth[socialaccount]>=65.3.1",
  "django>=5.1.5",
  "djangorestframework>=3.15.2",
  "aider-chat>=0.72.2",
  "django>=5.1.5",
  "fastapi>=0.111.1",
  "httpx==0.27.2",
  "loguru>=0.7.3",
  "pydantic-settings>=2.7.1",
  "pyjwt>=2.10.1",
  "pyperclip>=1.9.0",
  "python-dotenv>=1.0.0",
  "python-magic>=0.4.27",
  "questionary>=2.1.0",
  "tiktoken>=0.8.0",
  "transformers>=4.40.0",
  "typer>=0.15.1",
  "uvicorn[standard]>=0.30.6",
  "django-environ>=0.12.0",
  "argon2-cffi>=23.1.0",
  "python-decouple>=3.8",
  "pygithub>=2.6.0",
  "requests>=2.31.0",
  "django-extensions>=3.2.3",
  "django-jsoneditor>=0.1.0",
  "markdown>=3.7",
  "django-storages>=1.14.5",
  "boto3>=1.37.4",
  "google-genai>=1.2.0",
  "markdown-mermaidjs>=2.0.0",
  "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
  "bleach>=6.2.0",
  "django-cors-headers>=4.7.0",
  "stripe>=11.6.0",
  "google-generativeai>=0.8.4",
  "pytest>=8.3.4",
  "pre-commit>=4.1.0",
  "ruff>=0.9.7",
  "django-anymail[postmark]>=12.0",
  "docker>=7.1.0",
  "django-ninja>=1.4.1",
  "sse-starlette>=2.1.3",
  "django-eventstream>=4.2.0",
  "bpython>=0.25",
  "factory-boy>=3.3.3",
  "faker>=37.3.0",
  "pytest-django>=4.10.0",
  "mypy>=1.15.0",
  "coverage>=7.6.12",
  "django-fernet-encrypted-fields>=0.3.0",
  "celery>=5.5.2",
  "redis>=6.1.0",
  "django-celery-results>=2.6.0",
  "kombu>=5.5.3",
  "django-ninja-jwt>=5.3.0", # Added django-ninja-jwt
  "types-markdown>=3.8.0.20250415",
  "black>=25.1.0",
  "pyyaml>=6.0",
  "pynacl>=1.5.0",
]

[dependency-groups]
dev = [
  "coverage>=7.6.12",
  "django-coverage-plugin>=3.1.0",
  "django-debug-toolbar>=5.0.1",
  "django-extensions>=3.2.3",
  "django-stubs>=5.1.3",
  "djangorestframework-stubs>=3.15.3",
  "mypy>=1.15.0",
  "pre-commit>=4.1.0",
  "pytest>=8.3.4",
  "pytest-django>=4.10.0",
  "ruff>=0.9.7",
  "types-requests>=2.32.0.20250301",
  "whitenoise>=6.9.0",
]


[tool.uv.sources]
markdown-mermaidjs = { git = "https://github.com/Techarge/markdown-mermaidjs.git" }

[tool.uv.workspace]
members = ["rest_mcp_client", "prototypes"]

[tool.ruff]
target-version = "py311"
line-length = 120

# Exclude:
# - githubme/tmp/*: Temporary files
# - */migrations/*.py: Django migrations
# - staticfiles/*: Static files
# - treesitter/*: PoC - not production code
extend-exclude = [
  "githubme/tmp/*",
  "*/migrations/*.py",
  "staticfiles/*",
  "treesitter/*",
]

[tool.ruff.lint]
ignore = ["COM812", "EM101"]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  "PERF",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = ["S101", "PLR2004", "SLF001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "django.db.models.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "django.contrib.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.settings.*"
ignore_errors = true


[tool.pytest.ini_options]
norecursedirs = ["githubme/tmp/*"]
