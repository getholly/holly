[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:kasm_vnc]
command=/dockerstartup/kasm_default_profile.sh /dockerstartup/vnc_startup.sh /dockerstartup/kasm_startup.sh --tail-log
autostart=true
autorestart=true
stderr_logfile=/var/log/kasm_vnc.err.log
stdout_logfile=/var/log/kasm_vnc.out.log
priority=1

[program:remote_server]
command=uv run uvicorn remote_server:app --host 0.0.0.0 --port 8181 --app-dir /data
directory=/app/aiagent
autostart=true
autorestart=true
stderr_logfile=/var/log/remote_server.err.log
stdout_logfile=/var/log/remote_server.out.log
priority=10

[program:rest_mcp_client]
command=uv run uvicorn app.main:app --host 0.0.0.0 --port 8090 --app-dir /data
directory=/app/rest_mcp_client
autostart=true
autorestart=true
stderr_logfile=/var/log/rest_mcp_client.err.log
stdout_logfile=/var/log/rest_mcp_client.out.log
priority=10
