[project]
name = "rest-mcp-client"
version = "0.1.0"
description = "REST API server for communicating with LLM models"
authors = []
dependencies = [
    "fastapi[standard]>=0.111.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.5",
    "python-dateutil>=2.8.2",
    "requests>=2.31.0",
    "setuptools",
    "pytest>=8.3.5",
    "mcp-python-client>=0.1.9",
    "sse-starlette>=2.3.3",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=5.0.0",
    "bpython>=0.25",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]
requires-python = ">=3.10"


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rest_mcp_client"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

#[tool.setuptools.scripts]
#test = "pytest:main"
#test-cov = "pytest:main --cov=rest_mcp_client"

