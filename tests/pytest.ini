[pytest]
# pytest configuration for tests

# Django settings module for tests
DJANGO_SETTINGS_MODULE = config.settings.test

# Python path - ensure tests and backend are in the path
pythonpath = . ../backend ../backend/holly

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = unit e2e integration

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    e2e: End-to-end tests for complete workflows
    integration: Integration tests for component interactions
    asyncio: Async tests
    django_db: Tests that require database access
    slow: Slow-running tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --reuse-db

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# --cov=holly
# --cov-report=html
# --cov-report=term-missing

# Asyncio mode
asyncio_mode = auto

# Django test runner options
# Create test database even if it exists
# Use --reuse-db flag to reuse database between test runs
