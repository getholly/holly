name: Build Claude VNC Container

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'develop' }}
    steps:
      - name: Get repository and branch name
        id: repo-branch
        run: |
          # Extract repo name from GITHUB_REPOSITORY
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

          # Get branch name using GitHub's built-in context
          if [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
            # For pull requests, use pr-NUMBER format
            PR_NUMBER=$(echo $GITHUB_REF | cut -d '/' -f 3)
            echo "BRANCH_NAME=pr-$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            # For pushes, use the actual branch name
            echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

          # Create the checkout directory path
          echo "CHECKOUT_DIR=./${GITHUB_REPOSITORY#*/}_${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
          submodules: false

      - name: Configure Git for submodules
        run: |
          cd ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
          # Configure Git to use HTTPS with PAT instead of SSH for GitHub
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "git@github.com:"
          # Initialize and update submodules with the new configuration
          git submodule sync --recursive
          git submodule update --init --recursive


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}/hilly
          push: true
          tags: ghcr.io/lingster/hilly:latest
          provenance: false
