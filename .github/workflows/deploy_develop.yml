          echo "Created .env.develop file with required environment variables"

      - name: Build and start containers
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: |
          docker compose -f docker-compose.develop.yml up -d --build --force-recreate

        env:
          # You can also pass secrets directly to the command if needed
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.DEVELOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVELOP_AWS_SECRET_ACCESS_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.DEVELOP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DEVELOP_GITHUB_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY_NAME: ${{ secrets.DEVELOP_GITHUB_APP_PRIVATE_KEY_NAME }}
          GITHUB_APP_NAME: ${{ secrets.DEVELOP_GITHUB_APP_NAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DEVELOP_DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          STRIPE_SECRET_KEY: ${{ secrets.DEVELOP_STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY: ${{ secrets.DEVELOP_STRIPE_PUBLIC_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.DEVELOP_STRIPE_WEBHOOK_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          # Add other secrets here if needed
