name: Docker Compose Deployment(develop branch only)
on:
  push:
    branches: [develop]
jobs:
  deploy:
    runs-on: holly
    environment: develop
    steps:
      - name: Get repository and branch name
        id: repo-branch
        run: |
          # Extract repo name from GITHUB_REPOSITORY
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

          # Get branch name using GitHub's built-in context
          if [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
            # For pull requests, use pr-NUMBER format
            PR_NUMBER=$(echo $GITHUB_REF | cut -d '/' -f 3)
            echo "BRANCH_NAME=pr-$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            # For pushes, use the actual branch name
            echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

          # Create the checkout directory path
          echo "CHECKOUT_DIR=./${GITHUB_REPOSITORY#*/}_${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout code to custom location
        uses: actions/checkout@v4
        with:
          #ssh-key: ~/.ssh/id_ed25519
          #persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
          lfs: true
          submodules: false

      - name: Pull Git LFS files
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: git lfs pull

      - name: Configure Git for submodules
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: |
          # Configure Git to use HTTPS with PAT instead of SSH for GitHub
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "git@github.com:"
          # Initialize and update submodules with the new configuration
          git submodule sync --recursive
          git submodule update --init --recursive


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

