name: Docker Compose Deployment
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: githubme
    environment: production
    steps:
      - name: Get repository and branch name
        id: repo-branch
        run: |
          # Extract repo name from GITHUB_REPOSITORY
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

          # Get branch name using GitHub's built-in context
          if [[ $GITHUB_EVENT_NAME == 'pull_request' ]]; then
            # For pull requests, use pr-NUMBER format
            PR_NUMBER=$(echo $GITHUB_REF | cut -d '/' -f 3)
            echo "BRANCH_NAME=pr-$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            # For pushes, use the actual branch name
            echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

          # Create the checkout directory path
          echo "CHECKOUT_DIR=./${GITHUB_REPOSITORY#*/}_${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout code to custom location
        uses: actions/checkout@v4
        with:
          path: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy github app secret key pem file
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: |
          if [ -f "/home/githubme/analyse-github-repo.2025-03-13.private-key.pem" ]; then
            cp /home/githubme/analyse-github-repo.2025-03-13.private-key.pem ./
            echo "File copied successfully"
          else
            echo "File not found in /home/githubme/analyse-github-repo.2025-03-13.private-key.pem"
            exit 1
          fi

      - name: Create .env file from secrets
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: |
          # Create .env file from GitHub secrets
          touch .env.production
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> .env.production
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> .env.production
          echo "GITHUB_APP_NAME=${{ secrets.GH_APP_NAME }}" >> .env.production
          echo "GITHUB_APP_PRIVATE_KEY_PATH=${{ secrets.GH_APP_PRIVATE_KEY_PATH }}" >> .env.production
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env.production
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.production
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.production
          echo "DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}" >> .env.production
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.production
          echo "STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}" >> .env.production
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.production
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env.production
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.production
          echo "POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }}" >> .env.production
          # Add any other secrets you need

          # Optional: Load from existing .env file if it exists (for non-secret values)
          if [ -f .env.template ]; then
            echo "Appending non-secret values from .env.template"
            grep -v "^#" .env.template | grep -v "^\s*$" >> .env.production
          fi

          # Optional: Print confirmation without revealing values
          echo "Created .env.production file with required environment variables"

      - name: Build and start containers
        working-directory: ${{ steps.repo-branch.outputs.CHECKOUT_DIR }}
        run: |
          docker compose -f docker-compose.yml up -d --build --force-recreate web
          echo "sleeping for 120 to allow web container to startup"
          sleep 120
          docker compose -f docker-compose.yml up -d --build --force-recreate web2
        env:
          # You can also pass secrets directly to the command if needed
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY_NAME: ${{ secrets.GITHUB_APP_PRIVATE_KEY_NAME }}
          GITHUB_APP_NAME: ${{ secrets.GITHUB_APP_NAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          # Add other secrets here if needed
