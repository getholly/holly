server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (defense-in-depth; tokens currently live in the SPA so these
  # matter). add_header at the server level applies to every location below since
  # none of them define their own add_header.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
  # CSP: strong on clickjacking / base-tag / object injection. script-src/style-src
  # keep 'unsafe-inline' for now because the SvelteKit bundle relies on inline
  # bootstrap/styles; tighten to nonces/hashes as a follow-up.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # API proxy to Django backend
  location /api/ {
    proxy_pass http://web:8181;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin proxy to Django backend
  location /admin/ {
    proxy_pass http://web:8181;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static files proxy to Django backend
  location /static/ {
    proxy_pass http://web:8181;
    proxy_set_header Host $host;
  }

  # Media files proxy to Django backend
  location /media/ {
    proxy_pass http://web:8181;
    proxy_set_header Host $host;
  }

  # SPA routing - serve index.html for all other routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}

