services:
  frontend:
    image: holly-frontend:latest
    labels:
      - 'BUILD_ID=${BUILD_ID}'
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - web
    environment:
      - NODE_ENV=production
    mem_limit: 512m

  web:
    image: holly:latest
    labels:
      - 'BUILD_ID=${BUILD_ID}'
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    volumes:
      # NOTE: the SQLite bind mount is only used when DATABASE_URL is unset.
      # Set DATABASE_URL=postgres://...@db:5432/holly in .env.production to use the
      # shared Postgres service below (recommended; SQLite is single-writer and is
      # not shared with the Celery workers).
      - type: bind
        source: /home/holly/workarea/holly/db.sqlite3
        target: /app/holly/db.sqlite3
      - /home/holly/workarea/holly/staticfiles:/app/holly/staticfiles
      - /home/holly/workarea/holly/logdir:/app/holly/logdir
      - /data/holly:/holly
    ports:
      - '8181:8181'
    env_file:
      - .env.production
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REPO_BASE_PATH=/holly
    depends_on:
      - redis
      - rabbitmq
      - db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-holly}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-holly}
      - POSTGRES_DB=${POSTGRES_DB:-holly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-holly}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      # Override these via the compose env / .env; defaults are for local use only.
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-holly}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-holly}
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  celery:
    image: holly:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    command: /app/.venv/bin/celery -A config worker --loglevel=info
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - REPO_BASE_PATH=/holly
    depends_on:
      - redis
      - rabbitmq
      - db
    env_file:
      - .env.production
    mem_limit: 1g

  celery-beat:
    image: holly:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    command: /app/.venv/bin/celery -A config beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=info
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - redis
      - rabbitmq
      - celery
      - db
    env_file:
      - .env.production
    mem_limit: 512m

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
